# margin_quotes.yml – short lines shown in the empty margin beside a
# post, on wide screens only (see .post-side in main.css). One is
# picked per post, deterministically, based on the post's URL, so the
# same post always shows the same line/icon rather than flickering on
# every rebuild.
#
# `icon` must match one of the symbol ids already defined in
# _includes/icons-sprite.svg (icon-open-book, icon-quill, etc.) —
# check that file for the full list before adding a new entry.
#
# NOTE ON THE URDU TEXT: these are my own translations, not a native
# speaker's — please read them over before this goes live and adjust
# any phrasing that feels off. Everything here is original writing (not
# quoted from any author), so there's nothing to worry about
# copyright-wise, only phrasing/accuracy.

- icon: icon-letter
  text_en: "A letter is a visit paid in ink."
  text_ur: "خط، سیاہی میں کی گئی ملاقات ہے۔"

- icon: icon-open-book
  text_en: "Every margin is a doorway."
  text_ur: "ہر حاشیہ ایک دروازہ ہے۔"

- icon: icon-open-book-pen
  text_en: "Read slowly. Some sentences want to be lived with."
  text_ur: "آہستہ پڑھیں۔ کچھ جملے ساتھ رہنا چاہتے ہیں۔"

- icon: icon-journal
  text_en: "A classroom is a garden that grows in silence."
  text_ur: "جماعت ایک باغ ہے جو خاموشی میں پھلتا ہے۔"

- icon: icon-pen-nib
  text_en: "Write the sentence you needed to read today."
  text_ur: "وہ جملہ لکھیں جو آپ کو آج پڑھنے کی ضرورت تھی۔"

- icon: icon-book-stack
  text_en: "Books remember what we forget to ask."
  text_ur: "کتابیں وہ یاد رکھتی ہیں جو ہم پوچھنا بھول جاتے ہیں۔"

- icon: icon-dialogue
  text_en: "A good question outlives its answer."
  text_ur: "اچھا سوال اپنے جواب سے زیادہ زندہ رہتا ہے۔"

- icon: icon-quill
  text_en: "Ink dries; the thought does not."
  text_ur: "سیاہی خشک ہو جاتی ہے، خیال نہیں۔"

- icon: icon-mirror-book
  text_en: "Teach as if the lesson were a letter to yourself."
  text_ur: "سبق ایسے پڑھائیں جیسے یہ خود کو لکھا گیا خط ہو۔"

- icon: icon-papers
  text_en: "The blank page is only resting."
  text_ur: "خالی صفحہ صرف آرام کر رہا ہے۔"

- icon: icon-book-star
  text_en: "Every reader finishes a different book."
  text_ur: "ہر قاری ایک مختلف کتاب ختم کرتا ہے۔"

- icon: icon-open-book
  text_en: "Some lines are meant to be reread, not finished."
  text_ur: "کچھ سطریں دوبارہ پڑھنے کے لیے ہیں، ختم کرنے کے لیے نہیں۔"
